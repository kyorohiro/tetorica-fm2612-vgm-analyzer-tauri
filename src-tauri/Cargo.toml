[package]
name = "tetorica-fm2612-vgm-analyzer-tauri"
version = "0.40.13"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
